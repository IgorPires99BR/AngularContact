<div class="ph">
  <div>
    <h1 class="ph-title">Contatos</h1>
    <div class="ph-sub">POST /api/contato/incluir · GET /api/contato/obter-por-usuario/{{ '{' }}id{{ '}' }}</div>
  </div>
</div>

<div class="g2">
  <!-- NOVO CONTATO -->
  <div class="card">
    <div class="card-head"><div><div class="card-title">👥 Novo Contato</div></div></div>
    <div class="card-body">
      <div class="fg"><label>Nome Completo</label>
        <input type="text" placeholder="Maria Silva" [ngModel]="form().nome" (ngModelChange)="update('nome', $event)">
      </div>
      <div class="fg-row">
        <div class="fg"><label>Telefone (DDI)</label>
          <input type="text" placeholder="5511999887766" [ngModel]="form().tel" (ngModelChange)="update('tel', $event)">
        </div>
        <div class="fg"><label>Usuário ID</label>
          <input type="text" placeholder="ID do usuário" [ngModel]="form().uid" (ngModelChange)="update('uid', $event)">
        </div>
      </div>
      <div class="fg"><label>E-mail</label>
        <input type="email" placeholder="maria@email.com" [ngModel]="form().email" (ngModelChange)="update('email', $event)">
      </div>
      <button class="btn btn-primary" (click)="incluir()">
        ✅ <span class="btn-label-long">Incluir Contato</span><span class="hide-md">Incluir</span>
      </button>
      <div class="payload-display" *ngIf="response()" style="margin-top: 14px">{{ response() }}</div>
    </div>
  </div>

  <!-- BUSCAR / EXCLUIR -->
  <div class="card">
    <div class="card-head"><div><div class="card-title">Buscar Contatos</div><div class="card-sub">GET por usuário</div></div></div>
    <div class="card-body">
      <div class="fg-row mb-14">
        <div class="fg"><label>Usuário ID</label>
          <input type="text" placeholder="ID do usuário" [ngModel]="search()" (ngModelChange)="search.set($event)">
        </div>
        <div class="align-end"><button class="btn btn-primary">🔍 <span class="btn-label-long">Buscar</span></button></div>
      </div>

      <div class="crud-list-mini">
        <div class="crud-mini" *ngFor="let c of contatos()">
          <div class="crud-mini-name">{{ c.nome }}</div>
          <div class="crud-mini-meta mono">{{ c.tel }} · ID: {{ c.id }}</div>
        </div>
      </div>

      <div class="section-divider"></div>

      <div style="margin-bottom: 10px">
        <div class="card-title" style="color: var(--danger); font-size: .84rem">🗑 Excluir Contato</div>
      </div>
      <div class="fg-row">
        <div class="fg"><label>ID do Contato</label>
          <input type="text" placeholder="ID" [ngModel]="delId()" (ngModelChange)="delId.set($event)">
        </div>
        <div class="align-end"><button class="btn btn-danger" (click)="excluir()">Excluir</button></div>
      </div>
      <div class="payload-display" *ngIf="delResponse()" style="margin-top: 8px">{{ delResponse() }}</div>
    </div>
  </div>
</div>
