<div class="builder-section-head">
  <span class="builder-section-title">🧩 Etapas do Flow</span>
  <span class="builder-section-count">{{ etapas.length }} etapa{{ etapas.length === 1 ? '' : 's' }} configurada{{ etapas.length === 1 ? '' : 's' }}</span>
</div>

<div class="steps-container">
  <ng-container *ngFor="let step of etapas; let i = index; let first = first; let last = last; trackBy: trackByStepId">
    <div class="step-card fade-up" [ngClass]="stepAccentClass(step)">
      <div class="step-num">{{ stepIcon(step.tipoStep) }} {{ step.ordem }}</div>
      <div class="step-badge-inicio" *ngIf="step.ehEtapaInicial">🚀 Início</div>
      <div class="step-head">
        <select class="step-type-select"
                [ngModel]="step.tipoStep"
                (ngModelChange)="updateStep(step.id, { tipoStep: $event })">
          <option *ngFor="let t of stepTypes" [value]="t.value">{{ t.icon }} {{ t.label }}</option>
        </select>
        <div class="step-actions">
          <button class="btn btn-ghost btn-xs" (click)="moveStep(step.id, -1)" [disabled]="first" title="Mover para cima">↑</button>
          <button class="btn btn-ghost btn-xs" (click)="moveStep(step.id, 1)" [disabled]="last" title="Mover para baixo">↓</button>
          <button class="btn btn-ghost btn-xs" (click)="removeStep(step.id)" title="Remover">🗑</button>
        </div>
      </div>
      <div class="step-type-hint">{{ stepHint(step.tipoStep) }}</div>
      <div class="step-fg">
        <div class="step-fg-head">
          <label>Mensagem / Pergunta</label>
          <app-assistente-ia-botao
            label="✨ Sugerir"
            [instrucao]="instrucaoIa(step.tipoStep)"
            [contexto]="contextoIa(step)"
            (escolhido)="updateStep(step.id, { mensagemPergunta: $event })">
          </app-assistente-ia-botao>
        </div>
        <textarea rows="2"
                  [ngModel]="step.mensagemPergunta"
                  (ngModelChange)="updateStep(step.id, { mensagemPergunta: $event })"
                  placeholder="O que o bot diz neste step..."></textarea>
      </div>
      <div class="step-fg" *ngIf="step.tipoStep === 'Capturar Input'">
        <label>Variável de saída</label>
        <input type="text" placeholder="ex: nome, email, telefone"
               [ngModel]="step.variavelSaida"
               (ngModelChange)="updateStep(step.id, { variavelSaida: $event })">
      </div>
      <div class="step-fg" *ngIf="!first">
        <label>Gatilho de avanço</label>
        <input type="text" placeholder="palavra-chave que faz o flow chegar até aqui (ex: sim, quero, 1)"
               [ngModel]="step.gatilhoResposta || ''"
               (ngModelChange)="updateStep(step.id, { gatilhoResposta: $event })">
      </div>
    </div>
    <div class="step-connector" *ngIf="!last">
      <div class="step-connector-line"></div>
      <div class="step-connector-dot"></div>
      <div class="step-connector-line"></div>
    </div>
  </ng-container>
</div>

<div class="step-add-picker">
  <button type="button" class="step-add-chip" *ngFor="let t of stepTypes" (click)="addStep(t.value)">{{ t.chipLabel }}</button>
</div>
