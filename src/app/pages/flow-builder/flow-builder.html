<div class="ph">
  <div>
    <h1 class="ph-title">{{ isNew ? 'Novo Flow' : 'Editar Flow' }}</h1>
    <div class="ph-sub">Configure as etapas da conversa automática</div>
  </div>
  <div style="display:flex; gap:6px;">
    <button class="btn btn-ghost btn-sm" (click)="cancelar()">⬅ Voltar</button>
  </div>
</div>

<div *ngIf="response()" class="response-bar" style="margin-bottom: 16px; padding: 10px; border-radius: 6px; background: var(--bg2); font-size: 0.85rem;">
  {{ response() }}
</div>

<div *ngIf="carregando()" style="text-align:center; padding: 40px; color: var(--muted);">Carregando...</div>

<div class="flow-builder" *ngIf="!carregando()">
  <div class="flow-build-head">
    <div>
      <div class="card-title">{{ flow().nome || 'Novo Flow' }}</div>
      <div class="card-sub">Configure as etapas da conversa</div>
    </div>
    <div class="builder-actions">
      <select class="status-select"
              [ngModel]="flow().ativo"
              (ngModelChange)="updateField('ativo', $event === 'true' || $event === true)">
        <option [value]="true">● Ativo</option>
        <option [value]="false">○ Inativo</option>
      </select>
      <button class="btn btn-success btn-sm" [disabled]="sincronizando()" (click)="salvar()">
        💾 <span class="btn-label-long">Salvar</span>
      </button>
    </div>
  </div>

  <div class="flow-build-body">
    <div class="builder-section-head">
      <span class="builder-section-title">⚙️ Configurações do Flow</span>
    </div>
    <div class="fg mb-16">
      <label>Nome do Flow</label>
      <input type="text" placeholder="ex: Qualificação de Lead"
             [ngModel]="flow().nome"
             (ngModelChange)="updateField('nome', $event)">
    </div>
    <div class="fg mb-16">
      <label>Descrição do Flow</label>
      <input type="text" placeholder="ex: Fluxo enviado para novos leads"
             [ngModel]="flow().descricao"
             (ngModelChange)="updateField('descricao', $event)">
    </div>
    <div class="fg mb-16">
      <label>Gatilho inicial (palavra-chave que inicia o flow)</label>
      <input type="text" placeholder="oi, olá, início, quero saber mais..."
             [ngModel]="flow().gatilhoPalavraChave || ''"
             (ngModelChange)="updateField('gatilhoPalavraChave', $event)">
    </div>
    <div class="fg" style="margin-bottom: 18px">
      <label>Vincular a um número específico (opcional)</label>
      <app-numero-selector
        [value]="flow().numeroId || ''"
        opcaoTodos="Vale para todos os números da empresa"
        (valueChange)="updateField('numeroId', $event || null)">
      </app-numero-selector>
    </div>

    <app-flow-etapas-editor
      [etapas]="flow().etapas"
      (etapasChange)="onEtapasChange($event)">
    </app-flow-etapas-editor>
  </div>
</div>
