<div class="fg">
  <label>Conteúdo do Corpo (BODY)</label>

  <div class="tpl-body-toolbar">
    <button type="button" class="tpl-format-btn" title="Negrito" [disabled]="disabled()" (click)="aplicarNegrito()"><b>B</b></button>
    <button type="button" class="tpl-format-btn" title="Itálico" [disabled]="disabled()" (click)="aplicarItalico()"><i>I</i></button>
    <div class="tpl-emoji-wrap" #emojiWrap>
      <button type="button" class="tpl-format-btn" title="Inserir emoji" [disabled]="disabled()" (click)="alternarEmojis()">😀</button>
      <div class="tpl-emoji-picker" *ngIf="mostrarEmojis()">
        <button type="button" class="tpl-emoji-option" *ngFor="let e of emojis" (click)="inserirEmoji(e)">{{ e }}</button>
      </div>
    </div>
  </div>

  <textarea #bodyTextarea rows="5"
            placeholder="Use {{ '{{1}}' }}, {{ '{{2}}' }} para variáveis. Ex: Olá {{ '{{1}}' }}, seu pedido {{ '{{2}}' }} foi enviado!"
            [ngModel]="conteudo()"
            (ngModelChange)="onConteudoChange($event)"
            [disabled]="disabled()"></textarea>
  <div class="tpl-body-hint">Selecione um trecho e clique em <b>B</b>/<i>I</i> pra aplicar negrito/itálico — o WhatsApp usa *asteriscos* e _sublinhados_ pra isso, sem precisar de HTML.</div>
</div>

<div class="fg" *ngIf="exemplos().length > 0">
  <label>Valores de exemplo (exigidos pela Meta para aprovar o template)</label>
  <div class="tpl-exemplo-row" *ngFor="let ex of exemplos(); let i = index; trackBy: trackByIndex">
    <span class="badge badge-muted">{{ '{{' + (i + 1) + '}}' }}</span>
    <input type="text" [placeholder]="'Exemplo para a variável ' + (i + 1)" [ngModel]="ex.value" (ngModelChange)="updateExemplo(i, $event)" [disabled]="disabled()">
  </div>
</div>
