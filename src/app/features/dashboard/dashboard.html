<div class="shell">
  <aside class="sidebar">
    <div class="sb-brand">
      <div class="sb-logo">
        <svg viewBox="0 0 32 32" fill="none" width="28" height="28">
          <path d="M16 5C9.9 5 5 9.9 5 16c0 2.1.6 4.1 1.6 5.8L5.1 27l5.3-1.5C12 26.5 14 27.1 16.1 27.1c6.1 0 11-4.9 11-11C27.1 10 22.1 5 16 5z" fill="var(--primary)" fill-opacity="0.9" />
        </svg>
      </div>
      <span class="brand-name">Contact <span style="color: var(--primary)">Solution</span></span>
    </div>

    <nav class="sb-nav">
      <a href="#" class="nav-item active"><i class="ph-house"></i> Dashboard</a>
      <a href="#" class="nav-item"><i class="ph-users"></i> Instâncias</a>
      <a href="#" class="nav-item"><i class="ph-chat-circle"></i> Disparador</a>
    </nav>
  </aside>

  <main class="main">
    <header class="top-bar">
      <h2 class="page-title">Visão Geral</h2>
      <div class="user-badge">
        <div class="avatar">JS</div>
      </div>
    </header>

    <div class="content">
      <div class="grid-stats">
        <div class="card stat-card">
          <div class="card-head">
            <div class="card-title">Envios Ativos</div>
            <div class="card-sub">Total de leads processados</div>
          </div>
          <div class="card-body">
            <span class="stat-value">12.480</span>
            <span class="badge s">+12% hoje</span>
          </div>
        </div>
      </div>

      <div class="card mt24">
        <div class="card-head">
          <div>
            <div class="card-title">Configurar Webhook</div>
            <div class="card-sub">POST /api/v1/callback</div>
          </div>
        </div>
        <div class="card-body">
          <input class="fg-input" placeholder="https://sua-url.com/webhook">
          <button class="btn btn-primary mt12">Salvar Configuração</button>
        </div>
      </div>
    </div>
  </main>
</div>
